name: Hybrid Meta Engine Execution Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      user_query:
        description: 'Apni query Roman Urdu me likhein (e.g., Mujhe sniper aur moco ka setup chahiye)'
        required: true
        default: 'mujhe fast rush game khelna ha'

jobs:
  run-meta-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Parse Roman Urdu Prompt via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_QUERY: ${{ github.event.inputs.user_query }}
        run: python interface/prompt_parser.py

      - name: Run Hybrid Meta Engine
        env:
          # FF_PLAYSTYLE is automatically injected by the prompt_parser step
          FF_PLAYSTYLE: ${{ env.FF_PLAYSTYLE }}
        run: python main.py
