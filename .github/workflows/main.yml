name: FF Meta Engine CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      playstyle_prompt:
        description: 'Playstyle Prompt (e.g. rush, sniper, survival)'
        required: false
        default: 'rush'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai   # FIX: correct package name

      - name: Parse Playstyle Prompt
        id: parse_prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ github.event.inputs.playstyle_prompt || 'rush' }}
        run: |
          PLAYSTYLE=$(python -c "from interface.prompt_parser import parse_user_prompt; import os; print(parse_user_prompt(os.getenv('USER_PROMPT')))")
          echo "playstyle=$PLAYSTYLE" >> $GITHUB_OUTPUT
          echo "Parsed Playstyle Target: $PLAYSTYLE"

      - name: Run Hybrid Meta Engine
        env:
          FF_PLAYSTYLE: ${{ steps.parse_prompt.outputs.playstyle }}
        run: |
          python advisor_engine.py

      - name: Upload Advisory Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-advisory-report
          path: advisor_result.txt
